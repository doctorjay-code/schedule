<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>스마트 일정 관리</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="스마트일정">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="stylesheet" href="style.css?v=20260829_2256">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Auth Modal Overlay -->
  <div id="authModalOverlay" class="auth-modal-overlay">
    <div class="auth-card">
      <div class="auth-icon-wrap">
        <svg class="auth-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="auth-title">스마트 일정 관리</h2>
      <p class="auth-subtitle">일정에 접근하려면 비밀번호를 입력하세요.</p>
      
      <div class="auth-input-group">
        <input type="password" id="authPasswordInput" class="auth-input" placeholder="비밀번호 입력" autofocus>
      </div>
      
      <p id="authErrorMsg" class="auth-error-msg hidden">비밀번호가 올바르지 않습니다.</p>
      <p id="authLockoutTimer" class="auth-lockout-timer hidden">5회 오류: <span id="authTimerSeconds">60</span>초 후 다시 시도 가능</p>

      <button id="authSubmitBtn" class="auth-submit-btn">로그인</button>
    </div>
  </div>

  <div class="app-container">
    
    <!-- Top Unified App Bar -->
    <header class="app-header">
      <div class="top-nav-row">
        <!-- 1. Left: Schedule / Ledger Primary Switch -->
        <div class="primary-switch-pill" role="tablist">
          <button id="scheduleMenuBtn" class="primary-switch-btn active" role="tab" aria-selected="true">
            <span class="switch-icon">📅</span> 일정
          </button>
          <button id="ledgerMenuBtn" class="primary-switch-btn" role="tab" aria-selected="false">
            <span class="switch-icon">💰</span> 가계부
          </button>
        </div>

        <!-- 2. Right: Global Action Controls -->
        <div class="global-actions-wrap">
          <button id="openColorSettingsBtn" class="action-btn icon-btn" title="색상 설정">
            🎨
          </button>
          <button id="openStatsModalBtn" class="action-btn" title="통계 분석">
            📊 <span class="btn-text">통계</span>
          </button>
        </div>
      </div>

      <!-- Schedule Specific Secondary Sub-Bar -->
      <div id="scheduleSubBar" class="sub-nav-row">
        <div class="date-controls-group">
          <button id="prevWeekBtn" class="nav-arrow-btn" title="이전">◀</button>
          <h1 id="weekTitle" class="schedule-period-title" title="클릭하여 주차/월간 선택">
            2026.02.16–02.22 <span class="dropdown-arrow">▾</span>
          </h1>
          <button id="nextWeekBtn" class="nav-arrow-btn" title="다음">▶</button>
          <button id="todayBtn" class="today-tag-btn">오늘</button>
        </div>

        <div class="schedule-view-controls">
          <div class="view-switch-segmented" role="tablist">
            <button id="weeklyViewBtn" class="view-switch-btn active" role="tab" aria-selected="true">주간</button>
            <button id="monthlyViewBtn" class="view-switch-btn" role="tab" aria-selected="false">월간</button>
          </div>
          <button id="manualSyncBtn" class="action-btn icon-btn" title="Supabase DB 실시간 동기화">
            🔄
          </button>
        </div>
      </div>
    </header>

    <!-- Sub Status & Alert Quick Pills -->
    <section class="status-summary-bar">
      <!-- Left: Real-time Cloud State Badge -->
      <div class="sync-badge-wrap">
        <span id="syncStatus" class="sync-state-pill" data-state="saved">최신 일정 반영</span>
      </div>

      <!-- Right: Alert Indicator Chips -->
      <div class="alert-chips-wrap">
        <button id="unpaidSummaryBtn" class="summary-pill pill-unpaid" title="미결제 모아보기">
          <span class="pill-dot"></span>미결제 <strong id="unpaidCount">0</strong>
        </button>
        <button id="unappliedSummaryBtn" class="summary-pill pill-unapplied" title="미신청 모아보기">
          <span class="pill-dot"></span>미신청 <strong id="unappliedCount">0</strong>
        </button>
        <button id="unapprovedSummaryBtn" class="summary-pill pill-unapproved" title="미승인 모아보기">
          <span class="pill-dot"></span>미승인 <strong id="unapprovedCount">0</strong>
        </button>
      </div>
    </section>

    <!-- Filter Pills Row (Weekly Only) -->
    <div id="filterPillsRow" class="filter-pills-row">
      <button class="filter-chip active" data-filter="all">전체</button>
      <button class="filter-chip" data-filter="seoul">서울</button>
      <button class="filter-chip" data-filter="jinju">진주</button>
      <button class="filter-chip" data-filter="transport">교통</button>
      <button class="filter-chip" data-filter="unpaid">미결제</button>
      <button class="filter-chip" data-filter="unapplied">미신청</button>
      <button class="filter-chip" data-filter="unapproved">미승인</button>
      <button id="toggleMultiEditBtn" class="filter-chip multi-edit-chip" title="복수 셀을 선택하여 복사/붙여넣기">
        ☑️ 다중선택
      </button>
    </div>

    <!-- Multi Edit Action Floating Bar -->
    <div id="multiActionBar" class="multi-action-bar hidden">
      <div class="multi-action-info">
        <span id="selectedCountLabel">0개 선택됨</span>
      </div>
      <div class="multi-action-buttons">
        <button id="bulkCopyBtn" class="multi-btn btn-copy">📋 복사</button>
        <button id="bulkPasteBtn" class="multi-btn btn-paste">📥 붙여넣기</button>
      </div>
    </div>

    <!-- Active Copy Buffer Notification Bar -->
    <div id="copyBufferBar" class="copy-buffer-bar hidden">
      <div class="copy-buffer-content">
        <span class="copy-buffer-icon">📋</span>
        <div class="copy-buffer-text">
          <span class="copy-buffer-title">복사된 일정 클립보드</span>
          <span id="copiedItemLabel" class="copy-buffer-detail">-</span>
        </div>
      </div>
      <button id="clearCopyBtn" class="copy-buffer-clear" title="복사 취소">✕</button>
    </div>

    <!-- Main Content Area: Schedule View vs Ledger View -->
    <main class="main-content">
      
      <!-- 1. Weekly Schedule Table View -->
      <div id="weeklyViewWrapper" class="schedule-table-wrap">
        <table class="schedule-table">
          <thead>
            <tr>
              <th class="th-date">날짜</th>
              <th class="th-time">시간</th>
              <th class="th-region">지역</th>
              <th class="th-clinic">진료</th>
              <th class="th-trans">교통비</th>
              <th class="th-hr">국인체</th>
              <th class="th-ot">수당</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <!-- Dynamically Rendered Rows -->
          </tbody>
        </table>
      </div>

      <!-- 2. Monthly Calendar View -->
      <div id="monthlyViewWrapper" class="monthly-view-wrap hidden">
        <!-- Monthly Dynamic Color Legend Bar -->
        <div id="monthColorLegendBar" class="month-legend-bar">
          <!-- Dynamically Injected Region Legend Chips -->
        </div>

        <div class="monthly-calendar-header">
          <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div id="monthlyDaysGrid" class="monthly-days-grid">
          <!-- Dynamically Injected 35-42 Date Cells -->
        </div>
      </div>

      <!-- 3. Ledger (Fundplan) Modern View -->
      <div id="ledgerViewWrapper" class="ledger-view-wrap hidden">
        <div class="ledger-sub-bar">
          <div class="ledger-source-chips" role="tablist">
            <button id="ledgerCompanyCardBtn" class="ledger-source-chip" data-source="card" data-payment="기업카드">기업카드</button>
            <button id="ledgerTossBankBtn" class="ledger-source-chip active" data-source="card" data-payment="토스은행">토스은행</button>
            <button id="ledgerCashSourceBtn" class="ledger-source-chip" data-source="cash">현금</button>
            <button id="ledgerBankSourceBtn" class="ledger-source-chip" data-source="bank">기업은행</button>
            <button id="ledgerForecastSourceBtn" class="ledger-source-chip" data-source="forecast">잔액전망</button>
          </div>
          <div class="ledger-header-actions">
            <span id="ledgerDataBadge" class="ledger-sync-pill">DB 연결 중</span>
            <button id="ledgerSyncBtn" class="action-btn icon-btn" title="가계부 실시간 동기화" data-state="saved">🔄</button>
            <button id="ledgerColorSettingsBtn" class="action-btn icon-btn" title="가계부 태그 색상 설정">🎨</button>
          </div>
        </div>

        <div class="fundplan-table-wrap">
          <table class="schedule-table ledger-table">
            <thead>
              <tr>
                <th class="th-date">날짜</th>
                <th class="th-person">구분</th>
                <th class="th-category">분류</th>
                <th class="th-item">내용</th>
                <th class="th-amount">수입</th>
                <th class="th-amount">지출</th>
                <th class="th-balance">잔액</th>
              </tr>
            </thead>
            <tbody id="fundplanAllTimeList">
              <!-- Dynamically Rendered Transactions -->
            </tbody>
          </table>
        </div>
      </div>

    </main>

  </div>

  <!-- Modals and Overlays -->
  <div id="modalOverlay" class="modal-overlay hidden"></div>
  <div id="summaryModalOverlay" class="modal-overlay hidden"></div>
  <div id="weekSelectModalOverlay" class="modal-overlay hidden"></div>
  <div id="monthSelectModalOverlay" class="modal-overlay hidden"></div>
  <div id="colorSettingsModalOverlay" class="modal-overlay hidden"></div>

  <!-- Modular Bootstrap Script -->
  <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
